<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Flexbox</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }

      .part1 {
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: white;
        margin: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }

      .flex-12a {
        display: flex;
        gap: 10px;
      }
      .flex-12a .box:nth-child(1) {
        width: 200px;
        height: 40px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 8px;
      }
      .flex-12a .box:nth-child(2) {
        width: 75px;
        height: 40px;
        background: linear-gradient(135deg, #a855f7, #d946ef);
        border-radius: 8px;
      }

      .flex-12b {
        display: flex;
        gap: 10px;
      }
      .flex-12b .box:nth-child(1) {
        width: 50px;
        height: 40px;
        background-color: #3b82f6;
        border-radius: 8px;
      }
      .flex-12b .box:nth-child(2) {
        flex: 1;
        height: 40px;
        background-color: #e2e8f0;
        border-radius: 8px;
      }
      .flex-12b .box:nth-child(3) {
        width: 75px;
        height: 40px;
        background-color: #3b82f6;
        border-radius: 8px;
      }

      .flex-12c {
        display: flex;
        justify-content: space-between;
      }
      .flex-12c .box {
        width: 60px;
        height: 40px;
        background-color: #10b981;
        border-radius: 8px;
      }

      .flex-12d {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 60px;
        padding: 0 15px;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
      }
      .flex-12d .box {
        width: 60px;
        height: 40px;
        background-color: #f59e0b;
        border-radius: 8px;
      }

      .part2 {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin-top: 40px;
        border-radius: 20px;
        overflow: hidden;
        margin: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
      }

      .part2 header {
        background-color: #0f172a;
        border-bottom: 4px solid #3b82f6;
        flex: 0 0 80px;
      }

      .part2 .main-content {
        display: flex;
        flex: 1;
      }

      .part2 .left-nav {
        background-color: #1e293b;
        border-right: 1px solid #334155;
        width: 25%;
      }

      .part2 .right-nav {
        background-color: #ffffff;
        flex: 1;
      }

      .part2 footer {
        background-color: #0f172a;
        border-top: 4px solid #3b82f6;
        flex: 0 0 60px;
      }

      @media (max-width: 799px) {
        .part2 .main-content {
          flex-direction: column;
        }
        .part2 .right-nav {
          width: 100%;
          order: 1;
          flex: 1;
          border-bottom: 1px solid #e2e8f0;
        }
        .part2 .left-nav {
          width: 100%;
          order: 2;
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="part1">
      <div class="flex-12a">
        <div class="box"></div>
        <div class="box"></div>
      </div>

      <div class="flex-12b">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>

      <div class="flex-12c">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>

      <div class="flex-12d">
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>

    <div class="part2">
      <header></header>
      <div class="main-content">
        <div class="left-nav"></div>
        <div class="right-nav"></div>
      </div>
      <footer></footer>
    </div>
  </body>
</html>
